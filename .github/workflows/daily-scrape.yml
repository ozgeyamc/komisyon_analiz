name: Günlük Komisyon Güncelleme

on:
  schedule:
    # Her gün Türkiye saatiyle 08:17
    # Türkiye UTC+3 olduğu için GitHub cron: 05:17 UTC
    - cron: "17 4 * * *"

  workflow_dispatch:
    inputs:
      test_mail:
        description: "Test maili gönder (değişiklik olmasa da)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: komisyon-guncelleme
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # REPO
      # =====================================================

      - name: Repo'yu checkout et
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: |
          playwright install --with-deps chromium

      # =====================================================
      # ESKİ EXCEL YEDEĞİ
      # =====================================================

      - name: Eski Excel'i yedekle
        run: |
          if [ -f komisyonlar_guncel.xlsx ]; then
            cp komisyonlar_guncel.xlsx komisyonlar_guncel_eski.xlsx
          fi

      # =====================================================
      # SCRAPER
      # =====================================================

      - name: Scraper sürümlerini göster
        run: |
          python - <<'PY'
          modules = [
              ("YAPIKREDI", "scraper_yapikredi"),
              ("GARANTİ", "scraper"),
              ("İŞBANKASI", "scraper_isbank"),
              ("AKBANK", "scraper_akbank"),
              ("QNB", "scraper_qnb"),
              ("DENİZBANK", "scraper_denizbank"),
              ("HALKBANK", "scraper_halkbank"),
              ("VAKIFBANK", "scraper_vakifbank"),
              ("TEB", "scraper_teb"),
              ("ZİRAAT", "scraper_ziraat"),
          ]

          for banka, module_name in modules:
              try:
                  mod = __import__(module_name)
                  version = getattr(mod, "SCRAPER_VERSION", "SÜRÜM YOK")
                  print(f"{banka}: {version}")
              except Exception as exc:
                  print(f"{banka}: sürüm okunamadı -> {exc}")
          PY

      - name: Scraper'ı çalıştır ve Excel'i güncelle
        run: |
          python main.py

      # =====================================================
      # MAIL BİLDİRİMİ
      # =====================================================

      - name: Değişiklik kontrolü ve mail bildirimi
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          TEST_MODE="${{ github.event.inputs.test_mail }}"

          if [ "$TEST_MODE" = "true" ]; then
            python - <<'PY'
          from notify import check_and_notify

          check_and_notify(
              "komisyonlar_guncel_eski.xlsx",
              "komisyonlar_guncel.xlsx",
              test_mode=True
          )
          PY

          elif [ -f komisyonlar_guncel_eski.xlsx ]; then
            python - <<'PY'
          from notify import check_and_notify

          check_and_notify(
              "komisyonlar_guncel_eski.xlsx",
              "komisyonlar_guncel.xlsx"
          )
          PY

          else
            echo "[notify] İlk çalışma, karşılaştırma yapılmadı."
          fi

      # =====================================================
      # ARTIFACT
      # =====================================================

      - name: Excel dosyasını artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: komisyon-raporu
          path: komisyonlar_guncel.xlsx
          retention-days: 30

      # =====================================================
      # GIT DEĞİŞİKLİK KONTROLÜ
      # =====================================================

      - name: Excel değişmiş mi kontrol et
        id: git_check
        run: |
          if [ -n "$(git status --porcelain komisyonlar_guncel.xlsx)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Excel dosyasında değişiklik var."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Excel dosyasında değişiklik yok."
          fi

      # =====================================================
      # COMMIT + GÜVENLİ PUSH
      # =====================================================

      - name: Excel dosyasını commit et ve push et
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add komisyonlar_guncel.xlsx

          git commit -m "Komisyon ücretleri güncellendi ($(TZ='Europe/Istanbul' date +'%d.%m.%Y %H:%M'))"

          echo "Remote main güncelleniyor..."
          git fetch origin main

          echo "Güncel main üzerine rebase yapılıyor..."
          git rebase origin/main

          echo "Excel değişikliği push ediliyor..."
          git push origin HEAD:main
