name: QNB + DenizBank Hızlı Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-banks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: |
          playwright install --with-deps chromium

      # =====================================================
      # SÜRÜM KONTROLÜ
      # =====================================================

      - name: Scraper sürümlerini göster
        run: |
          echo "===== QNB ====="
          python -c "import scraper_qnb as s; print('DOSYA =', s.__file__); print('SURUM =', getattr(s, 'SCRAPER_VERSION', 'SURUM_YOK'))"

          echo ""
          echo "===== DENİZBANK ====="
          python -c "import scraper_denizbank as s; print('DOSYA =', s.__file__); print('SURUM =', getattr(s, 'SCRAPER_VERSION', 'SURUM_YOK'))"

      # =====================================================
      # QNB
      # =====================================================

      - name: QNB testi
        run: |
          python - <<'PY'
          from scraper_qnb import scrape_qnb

          print()
          print("========================================")
          print("QNB TESTİ BAŞLIYOR")
          print("========================================")

          rows = scrape_qnb()

          print()
          print(f"QNB TEST SONUCU: {len(rows)} satır")
          print("========================================")
          PY

      # =====================================================
      # DENİZBANK
      # =====================================================

      - name: DenizBank testi
        run: |
          python - <<'PY'
          from scraper_denizbank import (
              _scrape_with_requests,
              _print_integrity_report,
              _print_transfer_report,
              _print_product_checks,
          )

          print()
          print("========================================")
          print("DENİZBANK TESTİ BAŞLIYOR")
          print("========================================")

          rows, stats = _scrape_with_requests()

          print(f"DenizBank toplam benzersiz satır: {len(rows)}")

          _print_integrity_report(stats, len(rows))
          _print_transfer_report(rows)
          _print_product_checks(rows)

          print()
          print("========================================")
          print("DENİZBANK TESTİ TAMAMLANDI")
          print("========================================")
          PY
