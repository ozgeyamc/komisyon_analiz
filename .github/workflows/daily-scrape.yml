name: Günlük Komisyon Güncelleme

on:
  schedule:
    - cron: "0 5 * * *"  # Her gün sabah 05:00 UTC (Türkiye 08:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: playwright install --with-deps chromium

      - name: Scraper'ı çalıştır ve Excel'i güncelle
        run: python main.py

            - name: Excel dosyasını artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: komisyon-raporu
          path: garanti_komisyonlar.xlsx   # ← tum_bankalar değil, bu olmalı
          retention-days: 30

      - name: Değişiklik var mı kontrol et
        id: git_check
        run: |
          if [ -n "$(git status --porcelain tum_bankalar_komisyonlar.xlsx)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Excel dosyasını commit et ve push et
        if: steps.git_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tum_bankalar_komisyonlar.xlsx
          git commit -m "Komisyon ücretleri güncellendi ($(date +'%d.%m.%Y'))"
          git push
